name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q DatabaseAnggotaOfflineApp.zip -d project

      - name: Find Android project
        run: |
          find project -name gradlew -type f | head -1

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Database-Anggota-APK
          path: "**/build/outputs/apk/**/*.apk"
